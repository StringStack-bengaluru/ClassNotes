name: Deploy Books to GitHub Pages

# Deploy only from main (GitHub Pages environment blocks book/* branches).
# Every run rebuilds root + every book/* branch into /ClassNotes/<slug>/.
# npm ci runs once; book content is sparse-checked out without reinstalling.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (once)
        run: npm ci

      - name: Build every book into its own URL path
        run: |
          set -euo pipefail
          SITE_DIR="$PWD/site"
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"

          remote_ref() {
            local slug="$1"
            if git rev-parse --verify -q "origin/book/${slug}" >/dev/null; then
              echo "origin/book/${slug}"
            else
              return 1
            fi
          }

          list_all_slugs() {
            git branch -r \
              | sed -E 's/^[[:space:]]*//; s/^origin\///' \
              | grep '^book/' \
              | sed 's/^book\///' \
              | sort -u
          }

          echo "::group::Building root /ClassNotes/"
          git checkout -f main
          export VITE_BASE=/ClassNotes/
          npm run build
          cp -R dist/. "$SITE_DIR/"
          cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"
          echo "::endgroup::"

          mapfile -t SLUGS < <(list_all_slugs)
          echo "Building ${#SLUGS[@]} books: ${SLUGS[*]}"

          for slug in "${SLUGS[@]}"; do
            ref="$(remote_ref "$slug")" || {
              echo "::warning::Missing origin/book/${slug} — skip"
              continue
            }

            echo "::group::Building book/${slug} → /ClassNotes/${slug}/"
            git checkout -f main

            # Never keep main placeholder chapters (Demo 2) when building a real book
            rm -rf public/chapters content/book.config.json public/api/book-manifest.json
            mkdir -p public/chapters public/api content

            git checkout -f "$ref" -- \
              content/book.config.json \
              public/api/book-manifest.json \
              public/chapters

            if [[ -f public/chapters/02-demo-2.content.json || -f public/chapters/02-demo-2.pdf ]]; then
              echo "::error::Demo 2 leaked into ${slug}"
              ls -la public/chapters
              exit 1
            fi

            cfg_slug="$(node -e "const c=require('./content/book.config.json'); process.stdout.write(c.slug||'')")"
            if [[ -n "$cfg_slug" && "$cfg_slug" != "$slug" ]]; then
              echo "::error::book.config slug '${cfg_slug}' does not match folder '${slug}'"
              exit 1
            fi

            export VITE_BASE="/ClassNotes/${slug}/"
            npm run build

            mkdir -p "$SITE_DIR/$slug"
            cp -R dist/. "$SITE_DIR/$slug/"
            cp "$SITE_DIR/$slug/index.html" "$SITE_DIR/$slug/404.html"
            echo "::endgroup::"
          done

          git checkout -f main
          echo "Published index.html count:"
          find "$SITE_DIR" -maxdepth 2 -type f -name index.html | wc -l
          find "$SITE_DIR" -maxdepth 2 -type f -name index.html | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
